<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC 红白机模拟器</title>
    <style>
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            padding: 20px;
            position: relative; /* Changed from absolute to avoid overlap issues */
            z-index: 100; /* Higher z-index */
            background: rgba(26, 26, 26, 0.98);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
            margin: 20px auto;
        }
        .hidden { display: none !important; }
        h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 10px; }
        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background: #2a2a2a;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
            z-index: 11;
            position: relative;
        }
        .btn {
            padding: 10px 20px;
            background: #0080ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
            margin: 5px;
        }
        .btn:hover { background: #00f0ff; box-shadow: 0 0 15px #00f0ff; }
        .info { margin-top: 20px; font-size: 0.9rem; color: #aaa; }
        
        /* Game Screen Styles */
        #game-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background: #000;
            z-index: 1;
        }
        canvas { 
            image-rendering: pixelated; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
            transition: transform 0.2s ease;
        }
        .controls-hint { 
            position: absolute; 
            bottom: 10px; 
            color: #666; 
            font-size: 12px; 
            z-index: 2;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
        #back-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.4);
            color: white;
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border-radius: 50%;
        }
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #00f0ff;
        }
        .scale-controls {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
        }
        .turbo-controls {
            display: none;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px 10px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            align-items: center;
        }
        @media (hover: none) and (pointer: coarse) {
            .turbo-controls { display: flex; }
        }
        .turbo-btn {
            padding: 5px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 15px;
            font-size: 0.8rem;
        }
        .turbo-btn.active {
            background: #00f0ff;
            color: #000;
            border-color: #00f0ff;
        }
        .rate-selector {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }
        .scale-btn {
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 0.8rem;
        }
        .scale-btn:hover {
            background: rgba(0, 240, 255, 0.3);
        }
        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            padding: 20px;
            box-sizing: border-box;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: flex; }
            .controls-hint { display: none; }
            #game-screen canvas {
                margin-top: 5vh;
                max-height: 55vh;
            }
        }
        @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
            .mobile-controls {
                height: 100%;
                padding: 0 30px;
                align-items: center;
            }
            #game-screen canvas {
                margin-top: 0;
                max-height: 85vh;
            }
        }
        
        /* D-Pad Grid Layout for Multi-touch */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 2px;
            flex-shrink: 0;
        }
        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            transition: all 0.1s;
        }
        .d-btn.active { 
            background: rgba(0, 240, 255, 0.4); 
            border-color: #00f0ff;
            color: white;
        }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
        .d-center { 
            grid-column: 2; grid-row: 2; 
            background: rgba(0, 0, 0, 0.2); 
            border: none;
        }
        
        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }
        .ab-row {
            display: flex;
            gap: 25px;
            align-items: flex-end;
        }
        .a-btn, .b-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            font-weight: bold;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .a-btn.active, .b-btn.active { 
            background: rgba(0, 240, 255, 0.4); 
            border-color: #00f0ff;
        }
        
        .menu-row {
            display: flex;
            gap: 20px;
        }
        .m-btn {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #aaa;
            border-radius: 15px;
            font-size: 0.75rem;
        }
        .m-btn.active { 
            background: rgba(0, 240, 255, 0.3); 
            color: white;
        }
    </style>
</head>
<body>
    <!-- Selection UI -->
    <div class="container" id="selector-ui" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">
        <h1>🎮 FC 游戏启动器</h1>
        <p>请选择本地的 .nes ROM 文件或 .zip 压缩包</p>
        <input type="file" id="romInput" accept=".nes,.zip">
        <br>
        <button class="btn" onclick="startGame()">开始游戏</button>
        <div class="info">
            <p>操作说明：方向键移动，Z 为 A 键，X 为 B 键，Enter 为 Start，Shift 为 Select</p>
        </div>
    </div>

    <!-- Game UI -->
    <div id="game-screen" class="hidden">
        <button id="fullscreen-btn" class="btn" onclick="toggleFullScreen()">📺 全屏</button>
        <button id="back-btn" class="btn" onclick="stopGame()">❌</button>
        <div class="scale-controls">
            <button class="scale-btn" onclick="changeScale(-0.5)">-</button>
            <button class="scale-btn" id="scale-display" style="cursor: default">1x</button>
            <button class="scale-btn" onclick="changeScale(0.5)">+</button>
        </div>
        <canvas id="screen" width="256" height="240"></canvas>
        <div class="controls-hint">方向键:移动 | Z:A | X:B | Enter:Start | Shift:Select</div>
        <div class="mobile-controls">
            <div class="d-pad">
                <div class="d-btn d-up" data-key="38">▲</div>
                <div class="d-btn d-down" data-key="40">▼</div>
                <div class="d-btn d-left" data-key="37">◀</div>
                <div class="d-btn d-right" data-key="39">▶</div>
                <div class="d-btn d-center"></div>
            </div>
            <div class="action-group">
                <div class="ab-row">
                    <div class="b-btn" data-key="90">B</div>
                    <div class="a-btn" data-key="88">A</div>
                </div>
                <div class="menu-row">
                    <div class="m-btn" data-key="17">SELECT</div>
                    <div class="m-btn" data-key="13">START</div>
                </div>
            </div>
        </div>
        <div class="turbo-controls">
            <button class="turbo-btn" data-type="B" onclick="toggleTurbo(this)">B 连发</button>
            <button class="turbo-btn" data-type="A" onclick="toggleTurbo(this)">A 连发</button>
            <div class="rate-selector">
                <button class="turbo-btn rate-btn active" onclick="setTurboRate(10, this)">10次/s</button>
                <button class="turbo-btn rate-btn" onclick="setTurboRate(20, this)">20次/s</button>
                <button class="turbo-btn rate-btn" onclick="setTurboRate(30, this)">30次/s</button>
            </div>
        </div>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="lib/jsnes.min.js"></script>
    <script>
        // --- Game Engine Logic ---
        const SCREEN_WIDTH = 256;
        const SCREEN_HEIGHT = 240;
        const FRAMEBUFFER_SIZE = SCREEN_WIDTH * SCREEN_HEIGHT;

        let canvas_ctx, image;
        let framebuffer_u8, framebuffer_u32;
        let nes;
        let audio_ctx, script_processor;
        let isRunning = false;
        let currentScale = 1.5;
        let turboMode = { A: false, B: false };
        let turboRate = 10; // frames per second
        let frameCount = 0;

        const AUDIO_BUFFERING = 512;
        const SAMPLE_COUNT = 4 * 1024;
        const SAMPLE_MASK = SAMPLE_COUNT - 1;
        const audio_samples_L = new Float32Array(SAMPLE_COUNT);
        const audio_samples_R = new Float32Array(SAMPLE_COUNT);
        let audio_write_cursor = 0, audio_read_cursor = 0;

        function initAudio() {
            if (!audio_ctx) {
                audio_ctx = new (window.AudioContext || window.webkitAudioContext)();
                script_processor = audio_ctx.createScriptProcessor(AUDIO_BUFFERING, 0, 2);
                script_processor.onaudioprocess = audio_callback;
                script_processor.connect(audio_ctx.destination);
            }
            if (audio_ctx.state === 'suspended') {
                audio_ctx.resume();
            }
        }

        function audio_callback(event) {
            const dst = event.outputBuffer;
            const len = dst.length;
            const dst_l = dst.getChannelData(0);
            const dst_r = dst.getChannelData(1);
            for (let i = 0; i < len; i++) {
                const src_idx = (audio_read_cursor + i) & SAMPLE_MASK;
                dst_l[i] = audio_samples_L[src_idx];
                dst_r[i] = audio_samples_R[src_idx];
            }
            audio_read_cursor = (audio_read_cursor + len) & SAMPLE_MASK;
        }

        function onAnimationFrame() {
            if (!isRunning) return;
            window.requestAnimationFrame(onAnimationFrame);
            image.data.set(framebuffer_u8);
            canvas_ctx.putImageData(image, 0, 0);
            
            // Handle Turbo Logic
            frameCount++;
            const shouldFire = frameCount % Math.floor(60 / turboRate) === 0;
            
            if (turboMode.A && shouldFire) {
                nes.buttonDown(1, jsnes.Controller.BUTTON_A);
                setTimeout(() => nes.buttonUp(1, jsnes.Controller.BUTTON_A), 50);
            }
            if (turboMode.B && shouldFire) {
                nes.buttonDown(1, jsnes.Controller.BUTTON_B);
                setTimeout(() => nes.buttonUp(1, jsnes.Controller.BUTTON_B), 50);
            }
            
            nes.frame();
        }

        const KEYMAP = {
            88: jsnes.Controller.BUTTON_A,      // X
            90: jsnes.Controller.BUTTON_B,      // Z
            17: jsnes.Controller.BUTTON_SELECT, // Right Ctrl / Shift
            13: jsnes.Controller.BUTTON_START,  // Enter
            38: jsnes.Controller.BUTTON_UP,     // Up Arrow
            40: jsnes.Controller.BUTTON_DOWN,   // Down Arrow
            37: jsnes.Controller.BUTTON_LEFT,   // Left Arrow
            39: jsnes.Controller.BUTTON_RIGHT   // Right Arrow
        };

        document.addEventListener('keydown', (e) => {
            if (isRunning && KEYMAP[e.keyCode] !== undefined) {
                nes.buttonDown(1, KEYMAP[e.keyCode]);
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (isRunning && KEYMAP[e.keyCode] !== undefined) {
                nes.buttonUp(1, KEYMAP[e.keyCode]);
            }
        });

        // Mobile Touch Controls (Multi-touch support)
        const activeTouches = new Map();

        function handleTouch(e) {
            e.preventDefault();
            const touches = e.changedTouches;
            
            for (let i = 0; i < touches.length; i++) {
                const touch = touches[i];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!element) continue;

                const key = parseInt(element.getAttribute('data-key'));
                const type = element.getAttribute('data-type');
                
                if (e.type === 'touchstart') {
                    if (KEYMAP[key] !== undefined) {
                        nes.buttonDown(1, KEYMAP[key]);
                        element.classList.add('active');
                        activeTouches.set(touch.identifier, { element, key });
                    }
                } else if (e.type === 'touchend' || e.type === 'touchcancel') {
                    const active = activeTouches.get(touch.identifier);
                    if (active && KEYMAP[active.key] !== undefined) {
                        nes.buttonUp(1, KEYMAP[active.key]);
                        active.element.classList.remove('active');
                        activeTouches.delete(touch.identifier);
                    }
                }
            }
        }

        document.addEventListener('touchstart', handleTouch, { passive: false });
        document.addEventListener('touchend', handleTouch, { passive: false });
        document.addEventListener('touchcancel', handleTouch, { passive: false });

        function toggleTurbo(button) {
            const type = button.getAttribute('data-type');
            turboMode[type] = !turboMode[type];
            button.classList.toggle('active');
        }

        function setTurboRate(rate, btn) {
            turboRate = rate;
            document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function loadRomToScreen(romData) {
            document.getElementById('selector-ui').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            const canvas = document.getElementById('screen');
            canvas_ctx = canvas.getContext('2d');
            image = canvas_ctx.getImageData(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
            
            canvas_ctx.fillStyle = 'black';
            canvas_ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

            const buffer = new ArrayBuffer(image.data.length);
            framebuffer_u8 = new Uint8ClampedArray(buffer);
            framebuffer_u32 = new Uint32Array(buffer);

            nes = new jsnes.NES({
                onFrame: function(framebuffer_24) {
                    for (let i = 0; i < FRAMEBUFFER_SIZE; i++) {
                        framebuffer_u32[i] = 0xFF000000 | framebuffer_24[i];
                    }
                },
                onAudioSample: function(l, r) {
                    audio_samples_L[audio_write_cursor] = l;
                    audio_samples_R[audio_write_cursor] = r;
                    audio_write_cursor = (audio_write_cursor + 1) & SAMPLE_MASK;
                }
            });

            nes.loadROM(romData);
            initAudio();
            isRunning = true;
            updateScale();
            window.requestAnimationFrame(onAnimationFrame);
        }

        function changeScale(delta) {
            currentScale = Math.max(0.5, Math.min(5, currentScale + delta));
            updateScale();
        }

        function updateScale() {
            const canvas = document.getElementById('screen');
            canvas.style.transform = `scale(${currentScale})`;
            document.getElementById('scale-display').textContent = currentScale + 'x';
        }

        function stopGame() {
            isRunning = false;
            if (script_processor) script_processor.disconnect();
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('selector-ui').classList.remove('hidden');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }

        function toggleFullScreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    alert(`无法进入全屏模式: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- File Handling Logic ---
        function startGame() {
            const fileInput = document.getElementById('romInput');
            if (fileInput.files.length === 0) {
                alert('请先选择一个 ROM 文件！');
                return;
            }
            const file = fileInput.files[0];
            if (file.name.endsWith('.zip')) {
                handleZipFile(file);
            } else {
                handleNesFile(file);
            }
        }

        function handleNesFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                loadRomToScreen(e.target.result);
            };
            reader.readAsBinaryString(file);
        }

        async function handleZipFile(file) {
            try {
                const zip = new JSZip();
                const content = await zip.loadAsync(file);
                let nesFile = null;
                for (const filename in content.files) {
                    if (filename.toLowerCase().endsWith('.nes')) {
                        nesFile = content.files[filename];
                        break;
                    }
                }
                if (!nesFile) {
                    alert('ZIP 压缩包中未找到 .nes 格式的 ROM 文件！');
                    return;
                }
                const romData = await nesFile.async("binarystring");
                loadRomToScreen(romData);
            } catch (e) {
                alert('解压 ZIP 文件失败：' + e.message);
            }
        }
    </script>
</body>
</html>
