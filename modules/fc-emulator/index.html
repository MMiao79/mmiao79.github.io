<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC 红白机模拟器</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #1a1a1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }
        
        /* Selector UI */
        #selector-ui {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            z-index: 1000;
            padding: 20px;
        }
        .hidden { display: none !important; }
        
        h1 { color: #00f0ff; text-shadow: 0 0 10px #00f0ff; margin-bottom: 20px; font-size: 1.5rem; }
        p { color: #aaa; margin-bottom: 30px; text-align: center; }
        
        .file-input-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
        }
        .file-input-label {
            display: block;
            width: 100%;
            padding: 15px;
            background: #0080ff;
            color: white;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .file-input-label:active { background: #0060cc; transform: scale(0.98); }
        #romInput {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* Game Screen */
        #game-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas { 
            image-rendering: pixelated; 
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
        }

        /* Controls Overlay */
        .overlay-btn {
            position: absolute;
            z-index: 50;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            backdrop-filter: blur(4px);
        }
        #fullscreen-btn { top: 10px; left: 10px; }
        #back-btn { top: 10px; right: 10px; background: rgba(255, 0, 0, 0.3); }
        
        .scale-controls {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 15px;
        }
        .scale-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 5px 10px;
            font-size: 0.9rem;
        }

        /* Mobile Virtual Controls */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 45%;
            z-index: 40;
            padding: 20px 30px 40px;
            justify-content: space-between;
            align-items: flex-end;
        }
        @media (hover: none) and (pointer: coarse) {
            .mobile-controls { display: flex; }
        }
        @media (hover: none) and (pointer: coarse) and (orientation: landscape) {
            .mobile-controls { height: 100%; padding: 0 50px; align-items: center; }
        }
        
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 4px;
            flex-shrink: 0;
        }
        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.8rem;
        }
        .d-btn.active { background: rgba(0, 240, 255, 0.4); border-color: #00f0ff; }
        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }
        .d-center { grid-column: 2; grid-row: 2; background: rgba(0,0,0,0.2); border: none; }

        .action-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 25px; 
            flex-shrink: 0;
        }
        .ab-row { display: flex; gap: 30px; }
        .a-btn, .b-btn {
            width: 75px; height: 75px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1.8rem;
        }
        .a-btn.active, .b-btn.active { background: rgba(0, 240, 255, 0.4); border-color: #00f0ff; }
        
        .menu-row { display: flex; gap: 25px; margin-top: 5px; }
        .m-btn {
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 1px;
        }

        .turbo-bar {
            display: none;
            position: fixed;
            bottom: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 25px;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(8px);
        }
        @media (hover: none) and (pointer: coarse) { .turbo-bar { display: flex; } }
        .t-btn {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .t-btn.active { background: #00f0ff; color: black; border-color: #00f0ff; }
    </style>
</head>
<body>
    <!-- Selection UI -->
    <div id="selector-ui">
        <h1>🎮 FC 游戏启动器</h1>
        <p>请选择本地的 .nes ROM 文件或 .zip 压缩包</p>
        <div class="file-input-wrapper">
            <label class="file-input-label" for="romInput">📂 点击选择文件</label>
            <input type="file" id="romInput" accept=".nes,.zip">
        </div>
        <div style="color: #666; font-size: 0.8rem; margin-top: 20px;">
            支持格式：.nes, .zip
        </div>
    </div>

    <!-- Game UI -->
    <div id="game-screen" class="hidden">
        <button id="fullscreen-btn" class="overlay-btn" onclick="toggleFullScreen()">📺 全屏</button>
        <button id="back-btn" class="overlay-btn" onclick="stopGame()">❌</button>
        <div class="scale-controls">
            <button class="scale-btn" onclick="changeScale(-0.5)">-</button>
            <span id="scale-display" style="color:white; min-width: 30px; text-align:center;">1.5x</span>
            <button class="scale-btn" onclick="changeScale(0.5)">+</button>
        </div>
        <canvas id="screen" width="256" height="240"></canvas>
        
        <div class="mobile-controls">
            <div class="d-pad">
                <div class="d-btn d-up" data-key="38">▲</div>
                <div class="d-btn d-left" data-key="37">◀</div>
                <div class="d-btn d-center"></div>
                <div class="d-btn d-right" data-key="39">▶</div>
                <div class="d-btn d-down" data-key="40">▼</div>
            </div>
            <div class="action-group">
                <div class="ab-row">
                    <div class="b-btn" data-key="90">B</div>
                    <div class="a-btn" data-key="88">A</div>
                </div>
                <div class="menu-row">
                    <div class="m-btn" data-key="17">SELECT</div>
                    <div class="m-btn" data-key="13">START</div>
                </div>
            </div>
        </div>

        <div class="turbo-bar">
            <button class="t-btn" data-type="B" onclick="toggleTurbo(this)">B连发</button>
            <button class="t-btn" data-type="A" onclick="toggleTurbo(this)">A连发</button>
            <button class="t-btn active" onclick="setRate(10, this)">10/s</button>
            <button class="t-btn" onclick="setRate(20, this)">20/s</button>
        </div>
    </div>

    <script src="lib/jszip.min.js"></script>
    <script src="lib/jsnes.min.js"></script>
    <script>
        // --- Core Logic ---
        const SCREEN_WIDTH = 256, SCREEN_HEIGHT = 240;
        let nes, canvas_ctx, image, framebuffer_u8, framebuffer_u32;
        let audio_ctx, script_processor;
        let isRunning = false, currentScale = 1.5;
        let turboMode = { A: false, B: false }, turboRate = 10, frameCount = 0;
        const KEYMAP = { 88: 0, 90: 1, 17: 2, 13: 3, 38: 4, 40: 5, 37: 6, 39: 7 }; // jsnes button indices

        function initGame() {
            const canvas = document.getElementById('screen');
            canvas_ctx = canvas.getContext('2d');
            image = canvas_ctx.getImageData(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
            const buffer = new ArrayBuffer(image.data.length);
            framebuffer_u8 = new Uint8ClampedArray(buffer);
            framebuffer_u32 = new Uint32Array(buffer);

            nes = new jsnes.NES({
                onFrame: (buf) => { for(let i=0; i<buf.length; i++) framebuffer_u32[i] = 0xFF000000 | buf[i]; },
                onAudioSample: (l, r) => {} // Simplified for brevity
            });
            
            // Audio setup
            audio_ctx = new (window.AudioContext || window.webkitAudioContext)();
            script_processor = audio_ctx.createScriptProcessor(512, 0, 2);
            script_processor.connect(audio_ctx.destination);
        }

        function loadROM(data) {
            document.getElementById('selector-ui').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            if (!nes) initGame();
            nes.loadROM(data);
            isRunning = true;
            updateScale();
            requestAnimationFrame(loop);
        }

        function loop() {
            if (!isRunning) return;
            requestAnimationFrame(loop);
            image.data.set(framebuffer_u8);
            canvas_ctx.putImageData(image, 0, 0);
            
            frameCount++;
            if (frameCount % Math.floor(60 / turboRate) === 0) {
                if (turboMode.A) { nes.buttonDown(1, 0); setTimeout(() => nes.buttonUp(1, 0), 40); }
                if (turboMode.B) { nes.buttonDown(1, 1); setTimeout(() => nes.buttonUp(1, 1), 40); }
            }
            nes.frame();
        }

        // --- Input Handling ---
        const activeTouches = new Map();
        document.addEventListener('touchstart', (e) => {
            for (let t of e.changedTouches) {
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el && el.dataset.key) {
                    nes.buttonDown(1, KEYMAP[el.dataset.key]);
                    el.classList.add('active');
                    activeTouches.set(t.identifier, el);
                }
            }
        }, {passive: false});

        document.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                const el = activeTouches.get(t.identifier);
                if (el) {
                    nes.buttonUp(1, KEYMAP[el.dataset.key]);
                    el.classList.remove('active');
                    activeTouches.delete(t.identifier);
                }
            }
        });

        // Keyboard fallback
        document.addEventListener('keydown', (e) => { if(KEYMAP[e.keyCode]!==undefined) nes.buttonDown(1, KEYMAP[e.keyCode]); });
        document.addEventListener('keyup', (e) => { if(KEYMAP[e.keyCode]!==undefined) nes.buttonUp(1, KEYMAP[e.keyCode]); });

        // --- UI Functions ---
        function changeScale(d) { currentScale = Math.max(0.5, Math.min(5, currentScale + d)); updateScale(); }
        function updateScale() {
            document.getElementById('screen').style.transform = `scale(${currentScale})`;
            document.getElementById('scale-display').textContent = currentScale + 'x';
        }
        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }
        function stopGame() {
            isRunning = false;
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('selector-ui').classList.remove('hidden');
            if (document.fullscreenElement) document.exitFullscreen();
        }
        function toggleTurbo(btn) {
            const type = btn.dataset.type;
            turboMode[type] = !turboMode[type];
            btn.classList.toggle('active');
        }
        function setRate(r, btn) {
            turboRate = r;
            document.querySelectorAll('.turbo-bar .t-btn').forEach(b => { if(!b.dataset.type) b.classList.remove('active'); });
            btn.classList.add('active');
        }

        // --- File Loading ---
        document.getElementById('romInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            if (file.name.endsWith('.zip')) {
                const zip = await JSZip.loadAsync(file);
                const nesFile = Object.values(zip.files).find(f => f.name.toLowerCase().endsWith('.nes'));
                if (nesFile) loadROM(await nesFile.async("binarystring"));
                else alert('未找到 .nes 文件');
            } else {
                const reader = new FileReader();
                reader.onload = (ev) => loadROM(ev.target.result);
                reader.readAsBinaryString(file);
            }
        });
    </script>
</body>
</html>
