<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>（加密/解密 & 二维码）工具</title>
    <style>
        :root {
            --primary-color: #64b5f6;
            --secondary-color: #2d2d3e;
            --background-color: #1e1e2f;
            --text-color: #e0e0e0;
            --label-color: #bbdefb;
        }
        * {box-sizing: border-box;}
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 100%;
            margin: 0 auto;
            padding: 15px;
            line-height: 1.5;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        label {
            font-weight: bold;
            color: var(--label-color);
            font-size: 0.9rem;
        }
        select, input[type="text"], textarea {
            padding: 12px;
            border: 1px solid #424242;
            border-radius: 6px;
            background-color: var(--secondary-color);
            color: var(--text-color);
            width: 100%;
            font-size: 1rem;
        }
        textarea {min-height: 120px; resize: vertical;}
        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            flex: 1 1 calc(50% - 8px);
            min-width: calc(50% - 8px);
            max-width: 100%;
        }
        #encryptBtn {background-color: #4caf50; color: white;}
        #encryptBtn:hover {background-color: #3d8b40;}
        #decryptBtn {background-color: #2196f3; color: white;}
        #decryptBtn:hover {background-color: #1976d2;}
        #copyBtn {background-color: #ff9800; color: white;}
        #copyBtn:hover {background-color: #f57c00;}
        #qrGenerateBtn {background-color: var(--primary-color); color: white;}
        #qrGenerateBtn:hover {background-color: #42a5f5;}
        #qrSaveBtn {background-color: #9c27b0; color: white;}
        #qrSaveBtn:hover {background-color: #7b1fa2;}
        #clearResultBtn {background-color: #8e8e8e; color: white;}
        #clearResultBtn:hover {background-color: #575757;}
        #clearAllBtn {background-color: #2f2e2d; color: white;}
        #clearAllBtn:hover {background-color: #5f6e7d;}
        .output-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        .output-box {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .output-box textarea {
            flex-grow: 1;
            background-color: var(--secondary-color);
            color: var(--text-color);
        }
        .qr-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
            width: 100%;
        }
        .qr-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .qr-row > div {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
        }
        #qrResult, #qrDropArea {
            border: 1px dashed #424242;
            padding: 15px;
            text-align: center;
            min-height: 200px;
            background-color: var(--secondary-color);
            color: var(--label-color);
            border-radius: 6px;
            width: 100%;
        }
        #qrDropArea {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
                    padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s ease;
        }
        #qrDropArea.highlight {
            border-color: #4caf50;
            background-color: rgba(76, 175, 80, 0.1);
        }
        .auto-fill-notice {
            background-color: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            border-radius: 4px;
            padding: 8px;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #a5d6a7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>（加密/解密 & 二维码）工具</h1>
        <div class="input-group">
            <label for="modeSelect">加密模式:</label>
            <select id="modeSelect">
                <option value="aes">AES (推荐)</option>
                <option value="simple">简单替换</option>
            </select>
        </div>
        <div class="input-group">
            <label for="keyInput">密钥:</label>
            <input type="text" id="keyInput" placeholder="请输入（加密/解密）密钥">
        </div>
        <div class="input-group">
            <label for="textArea">原文/密文:</label>
            <textarea id="textArea" placeholder="在这里输入原文或粘贴密文..."></textarea>
        </div>
        <div class="buttons">
            <button id="encryptBtn">加密原文</button>
            <button id="decryptBtn">还原密文</button>
            <button id="copyBtn">复制结果</button>
            <button id="clearResultBtn">清空结果</button>
            <button id="qrGenerateBtn">生成二维码</button>
            <button id="qrSaveBtn">保存二维码</button>
            <button id="clearAllBtn">清空所有</button>
        </div>
        <div class="output-group">
            <label for="resultArea">加密/解密结果:</label>
            <textarea id="resultArea" readonly></textarea>
        </div>
        <div class="qr-container">
            <div class="qr-row">
                <div>
                    <label for="qrDropArea">读取二维码:</label>
                    <div id="qrDropArea">拖拽二维码图片到这里，或点击上传</div>
                    <input type="file" id="qrFileInput" accept="image/*" style="display: none;">
                </div>
                <div id="qrTextResult"></div>
            </div>
        </div>
    </div>
    <!-- 引入CryptoJS库用于AES加密 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取DOM元素
            const modeSelect = document.getElementById('modeSelect');
            const keyInput = document.getElementById('keyInput');
            const textArea = document.getElementById('textArea');
            const resultArea = document.getElementById('resultArea');
            const encryptBtn = document.getElementById('encryptBtn');
            const decryptBtn = document.getElementById('decryptBtn');
            const copyBtn = document.getElementById('copyBtn');
            const qrGenerateBtn = document.getElementById('qrGenerateBtn');
            const qrSaveBtn = document.getElementById('qrSaveBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const clearResultBtn = document.getElementById('clearResultBtn');
            const qrDropArea = document.getElementById('qrDropArea');
            const qrFileInput = document.getElementById('qrFileInput');
            const qrTextResult = document.getElementById('qrTextResult');
            
            // 获取当前页面URL（用于生成带参数的二维码）
            function getCurrentPageUrl() {
                return window.location.href.split('?')[0];
            }
            
            // 检查URL参数并自动填充
            function checkUrlParamsAndAutoFill() {
                const urlParams = new URLSearchParams(window.location.search);
                const cipherText = urlParams.get('cipher');
                if (cipherText) {
                    const decodedCipher = decodeURIComponent(cipherText);
                    if (textArea.value !== decodedCipher) {
                        textArea.value = decodedCipher;
                        keyInput.value = '';
                        keyInput.focus();

                        let notice = document.getElementById('autoFillNotice');
                        if (!notice) {
                            notice = document.createElement('div');
                            notice.id = 'autoFillNotice';
                            notice.className = 'auto-fill-notice';
                            notice.textContent = '✅ 已从链接自动填充密文，请输入密钥进行解密';
                            textArea.parentNode.appendChild(notice);
                        }
                    }
                }
            }

            // 页面加载时检查URL参数
            checkUrlParamsAndAutoFill();

            // 加密函数
            async function encrypt(text, key, mode) {
                if (!key) throw new Error('密钥不能为空');
                key = key.toString();
                text = text.toString();
                let encrypted;

                switch(mode) {
                    case 'aes':
                        encrypted = await aesEncrypt(text, key);
                        break;
                    case 'simple':
                        encrypted = simpleEncrypt(text, key);
                        break;
                    default:
                        encrypted = await aesEncrypt(text, key);
                }

                return encrypted || '';
            }

            // 解密函数
            async function decrypt(text, key, mode) {
                if (!key) throw new Error('密钥不能为空');
                key = key.toString();
                text = text.toString();
                let decrypted;

                switch(mode) {
                    case 'aes':
                        decrypted = await aesDecrypt(text, key);
                        break;
                    case 'simple':
                        decrypted = simpleDecrypt(text, key);
                        break;
                    default:
                        decrypted = await aesDecrypt(text, key);
                }

                return decrypted || '';
            }

            // 使用CryptoJS进行AES加密
            async function aesEncrypt(text, key) {
                try {
                    // 使用CryptoJS的AES加密
                    const encrypted = CryptoJS.AES.encrypt(text, key);
                    return encrypted.toString();
                } catch (e) {
                    console.error("AES加密错误:", e);
                    throw new Error("AES加密失败: " + e.message);
                }
            }

            // 使用CryptoJS进行AES解密
            async function aesDecrypt(encryptedText, key) {
                try {
                    const decrypted = CryptoJS.AES.decrypt(encryptedText, key);
                    const result = decrypted.toString(CryptoJS.enc.Utf8);
                    
                    if (!result) {
                        return "解密失败，可能是密钥错误";
                    }
                    
                    return result;
                } catch (e) {
                    console.error("AES解密错误:", e);
                    return "解密失败，可能是密钥错误或数据损坏";
                }
            }

            // 简单替换加密
            function simpleEncrypt(text, key) {
                let result = '';
                const keyLength = key.length;
                for (let i = 0; i < text.length; i++) {
                    const charCode = text.charCodeAt(i);
                    const keyChar = key.charCodeAt(i % keyLength);
                    result += String.fromCharCode((charCode + keyChar * 3) % 256);
                }
                return btoa(result);
            }

            // 简单替换解密
            function simpleDecrypt(text, key) {
                try {
                    const decoded = atob(text);
                    let result = '';
                    const keyLength = key.length;
                    for (let i = 0; i < decoded.length; i++) {
                        const charCode = decoded.charCodeAt(i);
                        const keyChar = key.charCodeAt(i % keyLength);
                        result += String.fromCharCode((charCode - keyChar * 3 + 256) % 256);
                    }
                    return result;
                } catch {
                    return "解密失败";
                }
            }

            // 复制结果到剪贴板
            function copyToClipboard() {
                if (!resultArea.value) {
                    alert('没有内容可复制');
                    return;
                }
                resultArea.select();
                document.execCommand('copy');
                alert('✅ 已复制到剪贴板');
            }

            // 清空结果内容
            function clearResultArea() {
                resultArea.value = '';
                qrDropArea.innerHTML = '拖拽二维码图片到这里，或点击上传';
                qrTextResult.textContent = '';
                qrFileInput.value = '';
                const notice = document.getElementById('autoFillNotice');
                if (notice) notice.remove();
            }

            // 清空所有内容
            function clearAll() {
                keyInput.value = '';
                textArea.value = '';
                resultArea.value = '';
                qrDropArea.innerHTML = '拖拽二维码图片到这里，或点击上传';
                qrTextResult.textContent = '';
                qrFileInput.value = '';
                const notice = document.getElementById('autoFillNotice');
                if (notice) notice.remove();
            }

            // 生成二维码
            qrGenerateBtn.addEventListener('click', async function() {
                let contentToEncode = resultArea.value.trim();
                if (!contentToEncode && textArea.value.trim()) {
                    contentToEncode = textArea.value.trim();
                }
                if (!contentToEncode) {
                    alert('请输入要生成二维码的内容');
                    return;
                }

                qrDropArea.innerHTML = ''; // 清空旧二维码

                const pageUrl = getCurrentPageUrl();
                const qrContent = `${pageUrl}?cipher=${encodeURIComponent(contentToEncode)}`;

                const canvas = document.createElement('canvas');
                QRCode.toCanvas(canvas, qrContent, { width: 256 }, function (error) {
                    if (error) {
                        console.error(error);
                        alert('❌ 二维码生成失败');
                        return;
                    }

                    qrDropArea.appendChild(canvas);

                    qrTextResult.textContent = contentToEncode === resultArea.value.trim()
                        ? "已生成加密内容的二维码"
                        : "已生成原文的二维码";

                    const tip = document.createElement('div');
                    tip.style.marginTop = '10px';
                    tip.style.fontSize = '0.8rem';
                    tip.style.color = '#bbdefb';
                    tip.textContent = '扫描此二维码将自动打开此页面并填充密文';
                    qrDropArea.appendChild(tip);
                });
            });

            // 保存二维码
            qrSaveBtn.addEventListener('click', function() {
                const canvas = qrDropArea.querySelector('canvas');
                if (!canvas) {
                    alert('请先生成二维码');
                    return;
                }
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });

            // 拖拽上传事件
            qrDropArea.addEventListener('click', () => qrFileInput.click());
            qrFileInput.addEventListener('change', handleFileSelect);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event =>
                qrDropArea.addEventListener(event, e => {
                    e.preventDefault();
                    e.stopPropagation();
                })
            );

            qrDropArea.addEventListener('dragover', () => qrDropArea.classList.add('highlight'));
            qrDropArea.addEventListener('dragleave', () => qrDropArea.classList.remove('highlight'));
            qrDropArea.addEventListener('drop', e => handleFileSelect(e));

            function handleFileSelect(e) {
                const file = e.dataTransfer?.files[0] || e.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => detectQRCode(img);
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }

            // 检测二维码
            function detectQRCode(img) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    qrTextResult.textContent = "🔍 识别成功: " + code.data;
                    textArea.value = code.data;
                } else {
                    qrTextResult.textContent = "❌ 未识别到二维码";
                }
            }

            // 加密按钮
            encryptBtn.addEventListener('click', async function() {
                const text = textArea.value.trim();
                const key = keyInput.value.trim();
                const mode = modeSelect.value;

                if (!text) {
                    alert('请输入要加密的原文');
                    textArea.focus();
                    return;
                }
                if (!key) {
                    alert('请输入密钥');
                    keyInput.focus();
                    return;
                }

                try {
                    const encrypted = await encrypt(text, key, mode);
                    if (encrypted) {
                        resultArea.value = encrypted;
                        resultArea.style.borderColor = '#4caf50';
                        setTimeout(() => resultArea.style.borderColor = '#424242', 1000);
                    } else {
                        resultArea.value = "⚠️ 加密失败：返回空结果";
                    }
                } catch (error) {
                    console.error("加密出错:", error);
                    resultArea.value = "❌ 加密失败：" + error.message;
                    alert("加密发生错误，请检查输入");
                }
            });

            // 解密按钮
            decryptBtn.addEventListener('click', async function() {
                const text = textArea.value.trim();
                const key = keyInput.value.trim();
                const mode = modeSelect.value;

                if (!text) {
                    alert('请输入要解密的密文');
                    return;
                }
                if (!key) {
                    alert('请输入密钥');
                    return;
                }

                let decrypted;
                if (mode === 'aes') {
                    decrypted = await decrypt(text, key, 'aes');
                    if (decrypted && !decrypted.includes("失败")) {
                        resultArea.value = decrypted;
                        return;
                    }
                }
                if (mode === 'simple') {
                    decrypted = simpleDecrypt(text, key);
                    if (decrypted && !decrypted.includes("失败")) {
                        resultArea.value = decrypted;
                        return;
                    }
                }

                // 自动尝试两种模式
                decrypted = await decrypt(text, key, 'aes');
                if (decrypted && !decrypted.includes("失败")) {
                    resultArea.value = decrypted;
                    return;
                }
                decrypted = simpleDecrypt(text, key);
                if (decrypted && !decrypted.includes("失败")) {
                    resultArea.value = decrypted;
                    return;
                }

                resultArea.value = "❌ 解密失败，请检查密钥或密文格式是否正确";
            });

            // 其他按钮绑定
            copyBtn.addEventListener('click', copyToClipboard);
            clearResultBtn.addEventListener('click', clearResultArea);
            clearAllBtn.addEventListener('click', clearAll);
        });
    </script>
</body>
</html>
